
[dependencies]
astropy-base = ">=7.1.1,<8"
astroquery = ">=0.4.11,<0.5"
corner = ">=2.2.3,<3"
emcee = ">=3.1.6,<4"
jupyter = ">=1.1.1,<2"
lmfit = ">=1.3.4,<2"
matplotlib-base = ">=3.10.7,<4"
multiprocess = ">=0.70.18,<0.71"
numpy = ">=2.3.4,<3"
pandas = ">=2.3.3,<3"
python = ">=3.13.9,<3.14"
scipy = ">=1.16.3,<2"
tqdm = ">=4.67.1,<5"

[pypi-dependencies]
ppxf = ">=9.4.2, <10"
pyastronomy = ">=0.24.0, <0.25"
pyqsofit = { path = ".", editable = true }
sfdmap2 = ">=0.2.2.post3, <0.3"

[tasks]
jpnb = "jupyter notebook"
updt = "pixi update && pixi ls -x"
upgd = "pixi upgrade --exclude python && pixi run updt"

[workspace]
channels = ["conda-forge"]
name = "PyQSOFit"
platforms = ["linux-64", "win-64", "osx-arm64"]
